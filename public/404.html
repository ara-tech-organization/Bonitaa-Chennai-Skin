<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Served by Apache for any path the site does not have. Deliberately kept
         out of the index: a 404 must never be treated as a real page. -->
    <meta name="robots" content="noindex, follow" />
    <title>Page not found | Bonitaa Skin and Hair Care</title>
    <!-- Absolute, and it includes the folder the site is deployed into. This
         file sits in public/ and is copied verbatim — Vite never rewrites it,
         so it cannot pick the base up the way index.html does. It has to match
         `base` in vite.config.js by hand. -->
    <link rel="icon" type="image/png" href="/skin/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Self-contained: the build's CSS filename is hashed and changes on every
         deploy, so this page cannot link to it. -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        font-family: 'Poppins', system-ui, sans-serif;
        color: #171208;
        background: #fdfaf4;
        text-align: center;
      }

      .code {
        display: inline-block;
        font-size: clamp(3.6rem, 13vw, 6rem);
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.03em;
        background: linear-gradient(122deg, #8b6514 0%, #c9a227 52%, #6f4f10 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      h1 {
        margin-top: 18px;
        font-size: clamp(1.35rem, 4vw, 1.9rem);
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      p {
        margin: 12px auto 0;
        max-width: 46ch;
        font-size: 1rem;
        font-weight: 300;
        line-height: 1.7;
        color: #8a8377;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 32px;
      }

      a {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 15px 28px;
        border-radius: 999px;
        font-size: 0.94rem;
        font-weight: 500;
        text-decoration: none;
        white-space: nowrap;
        transition:
          transform 0.35s ease,
          box-shadow 0.35s ease;
      }

      a:hover {
        transform: translateY(-2px);
      }

      .primary {
        color: #fffdf8;
        background: linear-gradient(122deg, #8b6514 0%, #c9a227 52%, #6f4f10 100%);
        box-shadow: 0 14px 34px -14px rgba(166, 124, 26, 0.55);
      }

      .secondary {
        color: #6f4f10;
        background: linear-gradient(120deg, #fefbf3, #fcf6e7);
        border: 1.5px solid #f0da96;
      }

      .rule {
        width: 54px;
        height: 2px;
        margin: 26px auto 0;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #c9a227, transparent);
      }

      small {
        display: block;
        margin-top: 26px;
        font-size: 0.82rem;
        color: #8a8377;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="code">404</span>
      <h1>This page doesn&rsquo;t exist</h1>
      <p>
        The link you followed isn&rsquo;t part of our site. Head back to the homepage, or call the
        clinic and we&rsquo;ll help you straight away.
      </p>
      <div class="rule"></div>

      <div class="actions">
        <a class="primary" href="/skin/">Back to homepage</a>
        <a class="secondary" href="tel:+919363700199">Call +91 93637 00199</a>
      </div>

      <small>Bonitaa Skin and Hair Care &mdash; Mylapore &amp; Velachery, Chennai</small>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || []
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' })
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != 'dataLayer' ? '&l=' + l : ''
        j.async = true
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl
        f.parentNode.insertBefore(j, f)
      })(window, document, 'script', 'dataLayer', 'GTM-N72LR9BD')
    </script>
    <!-- End Google Tag Manager -->
    <!--
      One icon for every surface — tab, bookmark, Android and iOS home screens.
      It is the B monogram cropped out of the logo artwork by
      scripts/make-favicon.js, which only ever reads src/assets/Logo.png. The
      wordmark and the mark's hairline frame are both dropped: neither survives
      being scaled to 32px.
    -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!--
      Title and description are the brief's, word for word, including the
      "Bonittaa" spelling. The MedicalClinic block further down keeps
      "Bonitaa Skin and Hair Care" — that field has to match the Google
      Business listing and the two map embeds exactly or the structured data
      stops resolving to this clinic. So the two spellings are deliberate and
      do different jobs; if the clinic has genuinely rebranded, the listing,
      the embeds and the schema all need changing together.
    -->
    <title>Skin Clinic Chennai | Acne, Pigmentation &amp; Laser Skin Treatments | Bonittaa</title>
    <meta
      name="description"
      content="Looking for the best Skin Clinic in Chennai? Get expert Acne Treatment, Pigmentation Treatment, Hydra Facial, Laser Hair Reduction, and Anti-Ageing treatments from Bonittaa Skin &amp; Hair Care. Call now or book your consultation today."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://bonitaa.in/chennai" />

    <!-- Mirrors the two tags above, so a shared link reads the same as a
         search result rather than carrying a second version of the copy. -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Skin Clinic Chennai | Acne, Pigmentation &amp; Laser Skin Treatments | Bonittaa"
    />
    <meta
      property="og:description"
      content="Looking for the best Skin Clinic in Chennai? Get expert Acne Treatment, Pigmentation Treatment, Hydra Facial, Laser Hair Reduction, and Anti-Ageing treatments from Bonittaa Skin &amp; Hair Care. Call now or book your consultation today."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MedicalClinic",
        "name": "Bonitaa Skin and Hair Care",
        "description": "Skin clinic in Chennai offering acne and acne scar treatment, pigmentation treatment, hydra facial, laser hair reduction, anti-ageing and skin brightening.",
        "telephone": "+91-9363700199",
        "medicalSpecialty": "Dermatology",
        "availableService": [
          { "@type": "MedicalTherapy", "name": "Acne & Acne Scar Treatment" },
          { "@type": "MedicalTherapy", "name": "Pigmentation Treatment" },
          { "@type": "MedicalTherapy", "name": "Hydra Facial" },
          { "@type": "MedicalTherapy", "name": "Laser Hair Reduction" },
          { "@type": "MedicalTherapy", "name": "Anti-Ageing Treatment" },
          { "@type": "MedicalTherapy", "name": "Skin Brightening" }
        ],
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.8",
          "bestRating": "5",
          "ratingCount": "150"
        },
        "location": [
          {
            "@type": "Place",
            "name": "Bonitaa Skin and Hair Care — Mylapore",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "First Floor, Door No: 200/1, Royapettah High Road",
              "addressLocality": "Chennai",
              "addressRegion": "Tamil Nadu",
              "postalCode": "600004",
              "addressCountry": "IN"
            }
          },
          {
            "@type": "Place",
            "name": "Bonitaa Skin and Hair Care — Velachery",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "No. 16, Bharathi Nagar Bus Stop, Tharamani",
              "addressLocality": "Chennai",
              "addressRegion": "Tamil Nadu",
              "postalCode": "600113",
              "addressCountry": "IN"
            }
          }
        ]
      }
    </script>
  </head>

        style="display: none; visibility: hidden"
      ></iframe

    <div id="root"></div>

</html>
